# https://developers.home-assistant.io/docs/apps/reference/configuration/
name: Certbot Scaleway
version: "1.0.0"
slug: certbot_scaleway
description: >-
  Generate and automatically renew Let's Encrypt certificates for your domains
  using the Scaleway DNS API (dns-01 challenge via certbot-dns-scaleway)
url: "https://github.com/MrWazaby/ha-certbot-scaleway/tree/main/certbot_scaleway"
arch:
  - aarch64
  - amd64
init: false
map:
  - ssl:rw
options:
  domains: []
  staging: false
  dns_propagation_seconds: 60
  renew_interval_hours: 12
schema:
  domains:
    - str
  email: email
  scaleway_api_token: str
  staging: bool
  dns_propagation_seconds: int(30,3600)
  renew_interval_hours: int(1,720)
image: "ghcr.io/mrwazaby/ha-certbot-scaleway"
